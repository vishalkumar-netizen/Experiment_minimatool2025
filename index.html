<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimatool Airline Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Minimatool Airline Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Flights</a></li>
                <li><a href="#">Bookings</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="flight-info">
            <h2>Flight Information</h2>
            <div class="flight-details">
                <!-- Existing JavaScript functionality will populate this section -->
            </div>
        </section>
        <section class="booking">
            <h2>Make a Booking</h2>
            <form id="bookingForm">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="flight">Flight:</label>
                <select id="flight" required>
                    <option value="">Select Flight</option>
                    <!-- Flight options will be populated by JavaScript -->
                </select>
                <button type="submit">Book Now</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Minimatool Airlines. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
